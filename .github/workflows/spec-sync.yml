name: Spec Sync (Platform API changes)

# Runs every day at 06:23 UTC, on a manual run and on a `spec-updated` dispatch. A scheduled run
# has no input and no payload, so it syncs from the default spec URL below. A red run means the SDK
# is behind the public API or a maintainer must act (see CONTRIBUTING.md, "Auto-Release (Spec Sync)").
on:
  schedule:
    - cron: '23 6 * * *'
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:
    inputs:
      spec_url:
        description: 'HTTPS URL of the OpenAPI document to sync from (default: the production Platform API public spec)'
        required: false
        type: string

permissions:
  # `contents: write` is required for the `git push --force-with-lease` of the rolling sync
  # branch; `pull-requests: read` for listing its pull requests. The workflow opens none: this
  # repository does not let workflows create pull requests.
  contents: write
  pull-requests: read

concurrency:
  # Single rolling group: serialize every dispatch onto the one rolling branch.
  # Same-spec no-op is enforced by the diff step below, not by the concurrency key.
  group: spec-sync
  cancel-in-progress: false

jobs:
  detect:
    name: Detect spec changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest spec
        env:
          # The unauthenticated public OpenAPI document of the production Platform API.
          DEFAULT_SPEC_URL: https://platform.api-us.concurrence.com/v1/openapi.json
          DISPATCH_SPEC_URL: ${{ github.event.client_payload.spec_url }}
          INPUT_SPEC_URL: ${{ inputs.spec_url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            SPEC_URL="$DISPATCH_SPEC_URL"
          else
            SPEC_URL="${INPUT_SPEC_URL:-$DEFAULT_SPEC_URL}"
          fi
          if [ -z "$SPEC_URL" ]; then
            echo "::error::No spec_url in client_payload"
            exit 1
          fi

          if ! printf '%s' "$SPEC_URL" | grep -Eq '^https://'; then
            echo "::error::spec_url must be an HTTPS URL"
            exit 1
          fi

          curl --fail --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 "$SPEC_URL" -o openapi-new.json

      - name: Validate downloaded spec
        run: |
          jq -e 'type == "object" and (.openapi | type == "string") and (.paths | type == "object")' openapi-new.json >/dev/null
          npm run openapi:sync -- --spec openapi-new.json --output openapi-public.json

      - name: Compare with committed spec
        id: diff
        run: |
          if ! diff -q openapi.json openapi-public.json >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Spec changed — will regenerate types"

            # Section-level diagnostics
            OLD_PATHS=$(jq -r '(.paths // {}) | keys | length' openapi.json)
            NEW_PATHS=$(jq -r '(.paths // {}) | keys | length' openapi-public.json)
            OLD_SCHEMAS=$(jq -r '(.components.schemas // {}) | keys | length' openapi.json)
            NEW_SCHEMAS=$(jq -r '(.components.schemas // {}) | keys | length' openapi-public.json)
            echo "Paths: $OLD_PATHS -> $NEW_PATHS"
            echo "Schemas: $OLD_SCHEMAS -> $NEW_SCHEMAS"

            # Where the committed spec and the new projection differ: JSON pointers, at most 200,
            # names only. Printed before the types are regenerated.
            node scripts/spec-diff-summary.mjs openapi.json openapi-public.json > spec-diff.txt || echo 'Difference summary unavailable.' > spec-diff.txt
            cat spec-diff.txt
            {
              echo "## Spec changed"
              echo ""
              echo '```'
              cat spec-diff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Spec unchanged — nothing to do"
          fi

      - name: Update spec + regenerate types
        if: steps.diff.outputs.changed == 'true'
        run: |
          cp openapi-public.json openapi.json
          npm run gen-types

      - name: Verify types compile
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run build
          npm test -- --reporter=dot

      - name: Prepare the sync branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
        run: |
          # Reject anything that isn't a 7–40 char hex string before it lands
          # in a commit message or a title shown to a maintainer.
          if [ -n "$SPEC_SHA" ] && ! printf '%s' "$SPEC_SHA" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::Invalid spec_sha payload: $(printf '%q' "$SPEC_SHA")"
            exit 1
          fi
          SHORT_SHA="${SPEC_SHA:0:8}"
          if [ -z "$SHORT_SHA" ]; then
            SHORT_SHA="${GITHUB_RUN_ID}"
          fi
          # Fixed branch: one rolling branch, force-pushed only when its content changes.
          BRANCH="chore/sync-api-types"
          PR_TITLE="chore: sync API types from platform (${SHORT_SHA})"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          DIFF_HEAD="$(head -n 1 spec-diff.txt)"

          # The pull requests of the rolling branch, read through the REST API. The decision
          # (paused or not, which one is open) is made by a tested script.
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&base=main&per_page=100" > pulls.json
          node scripts/spec-sync-pause.mjs pulls.json "$BRANCH" > sync-state.json
          cat sync-state.json
          PAUSED="$(jq -r '.paused' sync-state.json)"
          PAUSED_NUMBER="$(jq -r '.pausedBy.number // empty' sync-state.json)"
          PAUSED_URL="$(jq -r '.pausedBy.url // empty' sync-state.json)"
          OPEN_NUMBER="$(jq -r '.open.number // empty' sync-state.json)"
          OPEN_URL="$(jq -r '.open.url // empty' sync-state.json)"

          if [ "$PAUSED" = "true" ]; then
            # A reviewer closed the latest pull request of the branch without merging it:
            # nothing is pushed until a pull request from the branch is open or merged (see CONTRIBUTING.md).
            {
              echo "## Spec sync paused"
              echo ""
              echo "Pull request #${PAUSED_NUMBER} (${PAUSED_URL}) from ${BRANCH} was the last one closed and it was closed without merging, and none from the branch is open. Nothing was pushed."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Spec sync paused: PR #${PAUSED_NUMBER} (${PAUSED_URL}) from ${BRANCH} was closed without merging and no PR from the branch is open. The pause ends when a PR from the branch is open or one is merged after it; reopening the closed one may not be possible once its branch is deleted, in which case a maintainer pushes the branch by hand and opens a PR from it. Nothing was pushed."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fetch the rolling branch (if it exists) so `--force-with-lease` has a remote-tracking
          # ref to compare against and the content check below has something to compare with.
          # Distinguish "ref not found" (exit 128, expected on the first run) from any other
          # failure (auth, network, ...), which must stop the job.
          set +e
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          fetch_rc=$?
          set -e
          if [ "$fetch_rc" -ne 0 ] && [ "$fetch_rc" -ne 128 ]; then
            echo "::error::git fetch origin ${BRANCH} failed with exit ${fetch_rc} (auth/network); aborting to avoid a vacuous --force-with-lease."
            exit 1
          fi
          if [ "$fetch_rc" -eq 128 ]; then
            echo "::notice::Remote branch ${BRANCH} not found: first sync run."
          fi

          # -B resets the branch to the current HEAD (main from the checkout step), so the sync
          # commit is always exactly one commit on top of main.
          git checkout -B "$BRANCH"
          git add openapi.json src/generated/api.ts
          git commit -m "chore: sync API types from platform spec (${SHORT_SHA})"

          # Push only when the content differs: a new head every run would throw away the checks
          # of an open pull request.
          SAME_CONTENT=false
          if [ "$fetch_rc" -eq 0 ]; then
            LOCAL_SPEC="$(git rev-parse "HEAD:openapi.json")"
            LOCAL_TYPES="$(git rev-parse "HEAD:src/generated/api.ts")"
            REMOTE_SPEC="$(git rev-parse "origin/${BRANCH}:openapi.json" 2>/dev/null || true)"
            REMOTE_TYPES="$(git rev-parse "origin/${BRANCH}:src/generated/api.ts" 2>/dev/null || true)"
            if [ "$LOCAL_SPEC" = "$REMOTE_SPEC" ] && [ "$LOCAL_TYPES" = "$REMOTE_TYPES" ]; then
              SAME_CONTENT=true
            fi
          fi
          if [ "$SAME_CONTENT" = "true" ]; then
            BRANCH_STATE="not pushed: the remote branch already holds exactly this openapi.json and src/generated/api.ts"
          else
            git push --force-with-lease origin "$BRANCH"
            BRANCH_STATE="pushed: one commit on top of main with openapi.json and src/generated/api.ts"
          fi

          {
            echo "## Spec sync prepared"
            echo ""
            echo "- Differences from the committed spec: ${DIFF_HEAD} (listed in the step above)"
            echo "- Branch: ${BRANCH} (${BRANCH_STATE})"
            if [ -n "$OPEN_NUMBER" ]; then
              echo "- Open pull request from the branch: #${OPEN_NUMBER} ${OPEN_URL}"
            else
              echo "- Open pull request from the branch: none"
              echo "- Open one here: ${COMPARE_URL}"
              echo "- Title to use: ${PR_TITLE}"
              echo "- Merging it publishes a minor release (spec-auto-release.yml dispatches it after the Test workflow passes on main)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ -n "$OPEN_NUMBER" ] && [ "$SAME_CONTENT" = "true" ]; then
            echo "::notice::Pull request #${OPEN_NUMBER} (${OPEN_URL}) already carries this spec. Nothing to do but review and merge it."
          elif [ -n "$OPEN_NUMBER" ]; then
            echo "::error::Pull request #${OPEN_NUMBER} (${OPEN_URL}) carried an older spec and its branch was just updated. A push with the workflow token starts no checks on it: a maintainer must get the checks to run on the new head before merging."
            exit 1
          else
            echo "::error::The SDK is behind the public API (${DIFF_HEAD%:}). The branch ${BRANCH} is prepared; a maintainer opens the pull request: ${COMPARE_URL} with the title '${PR_TITLE}'. Merging it publishes a minor release."
            exit 1
          fi
